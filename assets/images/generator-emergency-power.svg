<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Generator and emergency power visual</title>
  <desc id="desc">Professional electrical engineering visual asset for PNW Electrical Engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="0.55" stop-color="#1f4f77"/>
      <stop offset="1" stop-color="#e7f0f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#dce8f2" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.95">
