<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Commercial tenant improvement electrical visual</title>
  <desc id="desc">Professional electrical engineering visual asset for PNW Electrical Engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="0.55" stop-color="#1f4f77"/>
      <stop offset="1" stop-color="#e7f0f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#dce8f2" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="34" fill="url(#grid)"/>
  <rect width="1200" height="760" rx="34" fill="url(#glow)"/>
  
  <g filter="url(#shadow)" transform="translate(125 146)">
    <rect width="860" height="470" rx="28" fill="#ffffff" opacity="0.95"/>
    <rect x="40" y="48" width="780" height="250" rx="18" fill="#eef4f8"/>
    <g stroke="#8da4b8" stroke-width="4" opacity="0.9"><path d="M90 92h680"/><path d="M90 140h680"/><path d="M90 188h680"/><path d="M90 236h680"/><path d="M194 70v206"/><path d="M318 70v206"/><path d="M442 70v206"/><path d="M566 70v206"/><path d="M690 70v206"/></g>
    <g fill="#c9902f"><circle cx="194" cy="140" r="14"/><circle cx="442" cy="140" r="14"/><circle cx="690" cy="140" r="14"/><circle cx="318" cy="236" r="14"/><circle cx="566" cy="236" r="14"/></g>
    <g stroke="#1f4f77" stroke-width="7" stroke-linecap="round"><path d="M118 360h224"/><path d="M118 398h310"/><path d="M540 360h220"/><path d="M540 398h150"/></g>
  </g>
  <text x="92" y="98" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Commercial Tenant Improvements</text>
  <text x="92" y="139" fill="#d9ecff" font-family="Arial, sans-serif" font-size="22">Lighting • panels • branch circuits • permit review</text>

</svg>