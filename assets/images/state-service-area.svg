<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Electrical engineering service areas visual</title>
  <desc id="desc">Professional electrical engineering visual asset for PNW Electrical Engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="0.55" stop-color="#1f4f77"/>
      <stop offset="1" stop-color="#e7f0f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#dce8f2" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.18" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="34" fill="url(#grid)"/>
  <rect width="1200" height="760" rx="34" fill="url(#glow)"/>
  
  <g filter="url(#shadow)" transform="translate(185 140)">
    <rect width="830" height="480" rx="30" fill="#ffffff" opacity="0.96"/>
    <path d="M160 330c68-84 118-118 182-110 58 7 70 62 136 60 84-3 100-92 182-88 62 3 108 56 122 120" fill="none" stroke="#1f4f77" stroke-width="12" stroke-linecap="round"/>
    <g fill="#c9902f"><circle cx="160" cy="330" r="17"/><circle cx="342" cy="220" r="17"/><circle cx="478" cy="280" r="17"/><circle cx="660" cy="192" r="17"/><circle cx="782" cy="312" r="17"/></g>
    <g font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#153752"><text x="120" y="120">WA</text><text x="300" y="120">OR</text><text x="480" y="120">ID</text><text x="660" y="120">NV</text></g>
    <g stroke="#8da4b8" stroke-width="5" stroke-linecap="round"><path d="M126 388h580"/><path d="M126 426h420"/></g>
  </g>
  <text x="92" y="98" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Licensed Electrical Engineering</text>
  <text x="92" y="139" fill="#d9ecff" font-family="Arial, sans-serif" font-size="22">Washington • Oregon • Idaho • Nevada</text>

</svg>